[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwmanager"
version = "0.1.0"
description = "A local, offline, encrypted password manager with a Qt desktop GUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pwmanager = "pwmanager.__main__:main"

[tool.setuptools.packages.find]
include = ["pwmanager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
